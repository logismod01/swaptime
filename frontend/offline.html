<!DOCTYPE html>
<html lang="ru" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>СвапТайм — нет сети</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f2f3f5;
            background:
                radial-gradient(1000px 700px at 15% -10%, #2a1a4d, transparent 60%),
                radial-gradient(900px 700px at 100% 110%, #3b1530, transparent 62%),
                #08080f;
        }
        .card {
            max-width: 420px;
            text-align: center;
            padding: 34px 28px;
            border-radius: 20px;
            background: rgba(22, 22, 32, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55);
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(140deg, #ff5f6d, #7c3aed);
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        p { font-size: 13.5px; line-height: 1.55; color: #a7aab8; }
        button {
            margin-top: 20px;
            padding: 11px 22px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #ff5f6d, #7c3aed);
        }
        button:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">S</div>
        <h1>Нет подключения</h1>
        <p>Похоже, интернет пропал. Сообщения, звонки и каналы подтянутся,
            как только связь вернётся — ничего не потеряется.</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    <script>
        window.addEventListener("online", () => location.reload());
    </script>
</body>
</html>
